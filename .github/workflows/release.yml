name: Build Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create release package
        run: |
          mkdir Martin
          cp -r Cogs Martin/
          cp -r Martin Martin/
          cp -r Utilities Martin/
          cp -r cogs_data Martin/
          cp main.py Martin/
          cp requirements.txt Martin/
          cp version.txt Martin/
          cp README.md Martin/
          cp LICENSE Martin/
          cp start_bot.bat Martin/
          cp star_bot.sh Martin/
          cp config.json.example Martin/
          cp .env.example Martin/

          zip -r Martin-${{ github.event.release.tag_name }}.zip Martin/

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "Martin-${{ github.event.release.tag_name }}.zip"